<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
</head>
<body>

<h2>Live Voting Dashboard</h2>

<div id="result"></div>

<button onclick="downloadPDF()">Download PDF</button>

<script>
function loadData(){
  let votes = JSON.parse(localStorage.getItem("votes")) || [];

  let a=0, b=0, c=0;
  let html = "";

  votes.forEach(v => {
    html += v.email + " - " + v.candidate + "<br>";

    if(v.candidate === "A") a++;
    if(v.candidate === "B") b++;
    if(v.candidate === "C") c++;
  });

  document.getElementById("result").innerHTML =
    "<h3>Results</h3>" +
    "A: " + a + "<br>" +
    "B: " + b + "<br>" +
    "C: " + c + "<br><br>" +
    "<h3>Votes List</h3>" +
    html;
}

function downloadPDF(){
  let votes = JSON.parse(localStorage.getItem("votes")) || [];

  let text = "VOTING REPORT\n\n";

  votes.forEach((v,i)=>{
    text += (i+1)+". "+v.email+" - "+v.candidate+" - "+v.time+"\n";
  });

  let blob = new Blob([text], {type:"text/plain"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "votes.txt";
  a.click();
}

loadData();
</script>

</body>
</html>
