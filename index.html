<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Global Indian Vote 2026</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
    padding-top:50px;
}

.container{
    width:350px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    cursor:pointer;
}

h2{
    margin-bottom:20px;
}

#message{
    margin-top:15px;
    font-weight:bold;
    color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>🇮🇳 Global Indian Vote 2026</h2>

<input type="email" id="email" placeholder="Enter Gmail ID">

<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">
Login
</button>

<div id="message"></div>

</div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

// 🔥 Initialize Firebase
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

// 🔐 LOGIN + AUTO SIGNUP
function login(){

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    // 🔥 LOGIN
    auth.signInWithEmailAndPassword(email, password)

    .then(() => {

        document.getElementById("message").innerHTML =
        "✅ Login Success";

        setTimeout(() => {

            window.location.href = "dashboard.html";

        }, 1000);

    })

    .catch((error) => {

        // 🔥 AUTO CREATE ACCOUNT
        if(
            error.code === "auth/user-not-found" ||
            error.code === "auth/invalid-credential"
        ){

            auth.createUserWithEmailAndPassword(email, password)

            .then(() => {

                document.getElementById("message").innerHTML =
                "✅ Account Created Successfully";

                setTimeout(() => {

                    window.location.href = "dashboard.html";

                }, 1000);

            })

            .catch((err) => {

                alert(err.message);

            });

        }
        else{

            alert(error.message);

        }

    });

}

</script>

</body>
</html>
