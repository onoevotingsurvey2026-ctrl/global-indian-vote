<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Results</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.counts{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.card{
    background:#0d6efd;
    color:white;
    padding:20px;
    margin:10px;
    border-radius:10px;
    width:160px;
}

canvas{
    margin-top:30px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#198754;
    color:white;
    cursor:pointer;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<h2>📊 Live Election Results</h2>

<div class="counts">

<div class="card">
<h3>Candidate A</h3>
<h1 id="countA">0</h1>
</div>

<div class="card">
<h3>Candidate B</h3>
<h1 id="countB">0</h1>
</div>

<div class="card">
<h3>Candidate C</h3>
<h1 id="countC">0</h1>
</div>

<div class="card">
<h3>Total Votes</h3>
<h1 id="totalVotes">0</h1>
</div>

</div>

<canvas id="barChart" height="120"></canvas>

<canvas id="pieChart" height="120"></canvas>

<button onclick="downloadPDF()">
⬇ Download PDF Report
</button>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let countA = 0;
let countB = 0;
let countC = 0;

let barChart;
let pieChart;

// REALTIME RESULTS
db.collection("votes").onSnapshot((snapshot) => {

    countA = 0;
    countB = 0;
    countC = 0;

    snapshot.forEach((doc) => {

        const data = doc.data();

        if(data.candidate === "A"){
            countA++;
        }

        if(data.candidate === "B"){
            countB++;
        }

        if(data.candidate === "C"){
            countC++;
        }

    });

    const totalVotes = countA + countB + countC;

    document.getElementById("countA").innerHTML = countA;
    document.getElementById("countB").innerHTML = countB;
    document.getElementById("countC").innerHTML = countC;

    document.getElementById("totalVotes").innerHTML = totalVotes;

    updateCharts();

});

// CHARTS
function updateCharts(){

    const values = [countA, countB, countC];

    if(barChart){
        barChart.destroy();
    }

    const barCtx = document.getElementById("barChart");

    barChart = new Chart(barCtx, {

        type: "bar",

        data: {

            labels: ["Candidate A","Candidate B","Candidate C"],

            datasets: [{
                label: "Votes",
                data: values,
                borderWidth: 1
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }

    });

    if(pieChart){
        pieChart.destroy();
    }

    const pieCtx = document.getElementById("pieChart");

    pieChart = new Chart(pieCtx, {

        type: "pie",

        data: {

            labels: ["Candidate A","Candidate B","Candidate C"],

            datasets: [{
                data: values
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }

    });

}

// PDF DOWNLOAD
function downloadPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    const totalVotes = countA + countB + countC;

    doc.text("Live Election Report", 20, 20);

    doc.text("Candidate A Votes: " + countA, 20, 50);

    doc.text("Candidate B Votes: " + countB, 20, 70);

    doc.text("Candidate C Votes: " + countC, 20, 90);

    doc.text("Total Votes: " + totalVotes, 20, 120);

    doc.save("Election_Report.pdf");

}

</script>

</body>
</html>
