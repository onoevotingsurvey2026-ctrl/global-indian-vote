<!DOCTYPE html>
<html>
<head>
  <title>Results</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<h2>Live Results</h2>

<canvas id="pieChart"></canvas>
<canvas id="barChart"></canvas>

<button onclick="downloadPDF()">Download PDF</button>
<button onclick="resetVotes()">Admin Reset</button>

<script>

let votes = JSON.parse(localStorage.getItem("votes")) || [];

let a=0,b=0,c=0;

votes.forEach(v=>{
  if(v.candidate==="A") a++;
  if(v.candidate==="B") b++;
  if(v.candidate==="C") c++;
});

// PIE CHART
new Chart(document.getElementById("pieChart"), {
  type: 'pie',
  data: {
    labels: ["A","B","C"],
    datasets: [{
      data: [a,b,c]
    }]
  }
});

// BAR CHART
new Chart(document.getElementById("barChart"), {
  type: 'bar',
  data: {
    labels: ["A","B","C"],
    datasets: [{
      data: [a,b,c]
    }]
  }
});

// PDF
function downloadPDF(){

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.text("Voting Report", 20, 20);
  doc.text("A: " + a, 20, 40);
  doc.text("B: " + b, 20, 50);
  doc.text("C: " + c, 20, 60);

  doc.save("report.pdf");
}

// RESET
function resetVotes(){
  if(confirm("Reset all votes?")){
    localStorage.removeItem("votes");
    location.reload();
  }
}

</script>

</body>
</html>
