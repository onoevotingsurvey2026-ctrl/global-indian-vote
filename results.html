<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Election Results</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

.counts{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
}

.card{
    background:#0d6efd;
    color:white;
    padding:20px;
    border-radius:10px;
    width:180px;
}

.card h1{
    font-size:40px;
}

.total{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
    color:#333;
}

.chart-container{
    width:100%;
    height:350px;
    margin-top:30px;
}

button{
    padding:12px 20px;
    margin-top:30px;
    border:none;
    border-radius:8px;
    background:green;
    color:white;
    font-size:16px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>📊 Live Election Results</h2>

<div class="counts">

<div class="card">
<h3>Candidate A</h3>
<h1 id="countA">0</h1>
</div>

<div class="card">
<h3>Candidate B</h3>
<h1 id="countB">0</h1>
</div>

<div class="card">
<h3>Candidate C</h3>
<h1 id="countC">0</h1>
</div>

</div>

<div class="total">
Total Votes: <span id="totalVotes">0</span>
</div>

<div class="chart-container">
<canvas id="barChart"></canvas>
</div>

<div class="chart-container">
<canvas id="pieChart"></canvas>
</div>

<button onclick="downloadPDF()">
⬇ Download PDF Report
</button>

</div>

<script>

// 🔥 FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

// 🔥 Initialize Firebase
firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let barChart;
let pieChart;

let finalA = 0;
let finalB = 0;
let finalC = 0;
let finalTotal = 0;

// 🔥 REALTIME FIREBASE
db.collection("votes").onSnapshot((snapshot) => {

    let countA = 0;
    let countB = 0;
    let countC = 0;

    snapshot.forEach((doc) => {

        const data = doc.data();

        if(data.candidate === "A"){
            countA++;
        }

        else if(data.candidate === "B"){
            countB++;
        }

        else if(data.candidate === "C"){
            countC++;
        }

    });

    const totalVotes = countA + countB + countC;

    // 🔥 STORE VALUES
    finalA = countA;
    finalB = countB;
    finalC = countC;
    finalTotal = totalVotes;

    // 🔥 UPDATE UI
    document.getElementById("countA").innerHTML = countA;
    document.getElementById("countB").innerHTML = countB;
    document.getElementById("countC").innerHTML = countC;

    document.getElementById("totalVotes").innerHTML = totalVotes;

    updateCharts(countA, countB, countC);

});

// 🔥 UPDATE CHARTS
function updateCharts(a, b, c){

    const values = [a, b, c];

    // BAR CHART
    if(barChart){
        barChart.destroy();
    }

    const barCtx = document.getElementById("barChart");

    barChart = new Chart(barCtx, {

        type: "bar",

        data: {

            labels: ["Candidate A", "Candidate B", "Candidate C"],

            datasets: [{

                label: "Votes",

                data: values,

                borderWidth: 1

            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }

    });

    // PIE CHART
    if(pieChart){
        pieChart.destroy();
    }

    const pieCtx = document.getElementById("pieChart");

    pieChart = new Chart(pieCtx, {

        type: "pie",

        data: {

            labels: ["Candidate A", "Candidate B", "Candidate C"],

            datasets: [{

                data: values

            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false
        }

    });

}

// 🔥 DOWNLOAD PDF
function downloadPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    doc.setFontSize(20);

    doc.text("Live Election Report", 20, 20);

    doc.setFontSize(14);

    doc.text("Candidate A Votes: " + finalA, 20, 50);

    doc.text("Candidate B Votes: " + finalB, 20, 70);

    doc.text("Candidate C Votes: " + finalC, 20, 90);

    doc.text("Total Votes: " + finalTotal, 20, 120);

    doc.text("Generated Time:", 20, 150);

    doc.text(new Date().toLocaleString(), 20, 165);

    doc.save("Election_Report.pdf");

}

</script>

</body>
</html>
