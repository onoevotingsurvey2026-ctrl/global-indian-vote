<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vote Now</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
    padding-top:50px;
}

.container{
    width:400px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
    padding:12px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#0d6efd;
    color:white;
    font-size:16px;
}

#submitBtn{
    width:100%;
    background:#198754;
}

.disabled{
    opacity:0.5;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="container">

<h2>🗳 Vote Now</h2>

<div id="voteSection">

<button onclick="selectCandidate('A')">
Candidate A
</button>

<button onclick="selectCandidate('B')">
Candidate B
</button>

<button onclick="selectCandidate('C')">
Candidate C
</button>

<br><br>

<button id="submitBtn" onclick="submitVote()" disabled>
Submit Vote
</button>

</div>

<h3 id="message"></h3>

</div>

<script>

// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

// INIT
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedCandidate = "";

// LOGIN CHECK
auth.onAuthStateChanged((user) => {

    if(!user){

        window.location.href = "index.html";
        return;

    }

    // CHECK ALREADY VOTED
    db.collection("votes").doc(user.uid).get()

    .then((doc) => {

        if(doc.exists){

            document.getElementById("voteSection").innerHTML = "";

            document.getElementById("message").innerHTML =
            "✅ You already voted successfully";

        }

    });

});

// SELECT
function selectCandidate(value){

    selectedCandidate = value;

    document.getElementById("submitBtn").disabled = false;

}

// SUBMIT
function submitVote(){

    const user = auth.currentUser;

    if(!user){

        alert("Please Login");
        return;

    }

    if(selectedCandidate === ""){

        alert("Please Select Candidate");
        return;

    }

    // FINAL DUPLICATE CHECK
    db.collection("votes").doc(user.uid).get()

    .then((doc) => {

        // ALREADY VOTED
        if(doc.exists){

            document.getElementById("voteSection").innerHTML = "";

            document.getElementById("message").innerHTML =
            "✅ You already voted successfully";

            return;

        }

        // SAVE VOTE
        db.collection("votes").doc(user.uid).set({

            candidate: selectedCandidate,
            email: user.email,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()

        })

        .then(() => {

            document.getElementById("voteSection").innerHTML = "";

            document.getElementById("message").innerHTML =
            "🎉 Vote Submitted Successfully";

            setTimeout(() => {

                window.location.href = "results.html";

            }, 1500);

        });

    });

}

</script>

</body>
</html>
