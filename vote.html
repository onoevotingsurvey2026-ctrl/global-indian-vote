<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote Page</title>

<!-- Firebase Compat -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    text-align:center;
    padding-top:40px;
}

.container{
    width:350px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:20px;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

.selected{
    background:green;
    color:white;
}

#submitBtn{
    background:#0d6efd;
    color:white;
}

#message{
    margin-top:20px;
    font-weight:bold;
    color:green;
}

</style>
</head>

<body>

<div class="container">

<h2>🗳 Vote Now</h2>

<div id="voteArea">

<button id="A" onclick="selectCandidate('A')">
Candidate A
</button>

<button id="B" onclick="selectCandidate('B')">
Candidate B
</button>

<button id="C" onclick="selectCandidate('C')">
Candidate C
</button>

<button id="submitBtn" disabled onclick="submitVote()">
Submit Vote
</button>

</div>

<div id="message"></div>

</div>

<script>

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

// 🔥 Initialize Firebase
firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedCandidate = "";

// 🔐 Login Check
auth.onAuthStateChanged(async (user) => {

    if (!user) {

        window.location.href = "index.html";
        return;
    }

    try {

        // 🔥 Check already voted
        const voteDoc = await db.collection("votes")
                                .doc(user.uid)
                                .get();

        if(voteDoc.exists){

            document.getElementById("voteArea").style.display = "none";

            document.getElementById("message").innerHTML =
            "✅ You already voted successfully";
        }

    }
    catch(error){

        console.log(error);
    }

});

// 🟢 Select Candidate
function selectCandidate(value){

    selectedCandidate = value;

    document.getElementById("submitBtn").disabled = false;

    ["A","B","C"].forEach(id => {

        document.getElementById(id).classList.remove("selected");

    });

    document.getElementById(value).classList.add("selected");
}

// 🟢 Submit Vote
async function submitVote(){

    const user = auth.currentUser;

    if(!user){

        alert("Login required");
        return;
    }

    if(!selectedCandidate){

        alert("Please select candidate");
        return;
    }

    try {

        // 🔥 Save Vote
        await db.collection("votes")
                .doc(user.uid)
                .set({

                    candidate: selectedCandidate,
                    email: user.email,
                    mobile: "NOT_ADDED",
                    timestamp: new Date()

                });

        // 🔥 Success Message
        document.getElementById("voteArea").style.display = "none";

        document.getElementById("message").innerHTML =
        "🎉 Vote Submitted Successfully";

    }
    catch(error){

        alert(error.message);
        console.log(error);
    }
}

</script>

</body>
</html>
