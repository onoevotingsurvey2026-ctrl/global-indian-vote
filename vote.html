<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vote Page</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<style>
body{
    text-align:center;
    font-family:Arial;
    background:#f4f6f9;
}

button{
    padding:10px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.selected{
    background:green;
    color:white;
}

#message{
    color:red;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>🗳 Vote Now</h2>

<div id="voteArea">

<button onclick="selectCandidate('A')" id="A">
Candidate A
</button>

<button onclick="selectCandidate('B')" id="B">
Candidate B
</button>

<button onclick="selectCandidate('C')" id="C">
Candidate C
</button>

<br>

<button id="submitBtn" disabled onclick="submitVote()">
Submit Vote
</button>

</div>

<h3 id="message"></h3>

<script>

// 🔥 Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let selectedCandidate = "";

// 🔐 AUTH GUARD
firebase.auth().onAuthStateChanged(async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    // 🔥 CHECK ALREADY VOTED
    const doc = await db.collection("votes")
                        .doc(user.uid)
                        .get();

    if(doc.exists){

        document.getElementById("voteArea").style.display = "none";

        document.getElementById("message").innerHTML =
        "✅ You already voted successfully";

    }
});

// 🟢 Candidate Select
function selectCandidate(value){

    selectedCandidate = value;

    document.getElementById("submitBtn").disabled = false;

    ["A","B","C"].forEach(id=>{
        document.getElementById(id).classList.remove("selected");
    });

    document.getElementById(value).classList.add("selected");
}

// 🟢 Submit Vote
async function submitVote(){

    let user = auth.currentUser;

    if(!user){
        alert("Login required");
        return;
    }

    if(!selectedCandidate){
        alert("Please select candidate");
        return;
    }

    try{

        // 🔥 DOUBLE CHECK
        const existingVote = await db.collection("votes")
                                     .doc(user.uid)
                                     .get();

        if(existingVote.exists){

            alert("You already voted");
            return;
        }

        // 🔥 SAVE VOTE
        await db.collection("votes")
                .doc(user.uid)
                .set({
                    candidate: selectedCandidate,
                    email: user.email,
                    mobile: "NOT_ADDED",
                    timestamp: new Date()
                });

        // 🔥 LOCK UI
        document.getElementById("voteArea").style.display = "none";

        document.getElementById("message").innerHTML =
        "🎉 Vote Submitted Successfully";

    }
    catch(error){

        alert(error.message);
    }
}
</script>

</body>
</html>
