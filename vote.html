<!DOCTYPE html>
<html>
<head>
  <title>Vote Page</title>
</head>

<body>

<h2>Vote for Your Candidate</h2>

<p id="userBox"></p>

<button onclick="vote('A')">Vote A</button>
<button onclick="vote('B')">Vote B</button>
<button onclick="vote('C')">Vote C</button>

<script>

// ---------------- SHOW USER ----------------
const user = localStorage.getItem("user");

if(!user){
  alert("Please login first");
  window.location.href = "index.html";
}

document.getElementById("userBox").innerText = "Logged in as: " + user;

// ---------------- FINAL VOTE FUNCTION ----------------
function vote(candidate){

  const user = localStorage.getItem("user");

  // safety check
  if(!user){
    alert("Please login first");
    window.location.href = "index.html";
    return;
  }

  // 🔴 CHECK IF ALREADY VOTED
  if(localStorage.getItem(user + "_voted") === "true"){
    alert("❌ You have already voted. Multiple voting not allowed.");
    return;
  }

  // load existing votes
  let votes = JSON.parse(localStorage.getItem("votes")) || [];

  // save new vote
  votes.push({
    email: user,
    candidate: candidate,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("votes", JSON.stringify(votes));

  // 🔴 LOCK USER AFTER FIRST VOTE
  localStorage.setItem(user + "_voted", "true");

  alert("✅ Vote submitted successfully");

  // go to result page
  window.location.href = "result.html";
}

</script>

</body>
</html>
