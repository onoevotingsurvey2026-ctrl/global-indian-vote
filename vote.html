<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vote Page</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

<style>
body{text-align:center;font-family:Arial;}
button{padding:10px;margin:10px;}
.selected{background:green;color:white;}
</style>
</head>

<body>

<h2>Vote Now</h2>

<button onclick="selectCandidate('A')" id="A">Candidate A</button>
<button onclick="selectCandidate('B')" id="B">Candidate B</button>
<button onclick="selectCandidate('C')" id="C">Candidate C</button>

<br>

<button id="submitBtn" disabled onclick="submitVote()">Submit Vote</button>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCfyVODifxy7a1Vt80IcU-ixhZwu6W0Jeg",
  authDomain: "onoevote2026.firebaseapp.com",
  databaseURL: "https://onoevote2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "onoevote2026",
  storageBucket: "onoevote2026.firebasestorage.app",
  messagingSenderId: "181065724520",
  appId: "1:181065724520:web:f72a93869786373c1101dd"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let selectedCandidate = "";

// 🔐 AUTH GUARD
firebase.auth().onAuthStateChanged((user) => {
    if (!user) {
        window.location.href = "index.html";
    }
});

// Candidate select
function selectCandidate(value){
    selectedCandidate = value;
    document.getElementById("submitBtn").disabled = false;

    ["A","B","C"].forEach(id=>{
        document.getElementById(id).classList.remove("selected");
    });

    document.getElementById(value).classList.add("selected");
}

// Submit vote
function submitVote(){
    let user = auth.currentUser;

    if(!user){
        alert("Login required");
        return;
    }

    if(!selectedCandidate){
        alert("Select candidate");
        return;
    }

    db.collection("votes").doc(user.uid).set({
        candidate: selectedCandidate,
        email: user.email,
        mobile: "NOT_ADDED",
        timestamp: new Date()
    }).then(()=>{
        alert("Vote Submitted Successfully");
    });
}
</script>

</body>
</html>
